# Checks the formatting and the types and runs the tests: on every pull request, and before each deployment (deploy.yml).
name: Test

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the dependencies
        run: npm ci
      - name: Check the formatting
        run: npm run format:check
      - name: Check the types
        run: npx astro check
      - name: Run the tests
        run: npm test
