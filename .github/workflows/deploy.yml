# Runs the checks and the tests, then builds the site (with the link check) and publishes it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push does not cancel a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing is built or published if a check fails: the version published before stays online.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the dependencies
        run: npm ci
      - name: Check the formatting
        run: npm run format:check
      - name: Check the types
        run: npx astro check
      - name: Run the tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # The sound files are not in the repository (scripts/audio/README.md).
      AUDIO_SOURCE: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Build the site and upload it as a Pages artifact
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
